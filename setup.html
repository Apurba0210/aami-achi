<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aami Achi - Caregiver Setup</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; }
        h2 { color: #2e7d32; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin-top: 10px; font-weight: bold;}
        button:hover { background: #1b5e20; }
        #result { margin-top: 20px; display: none; }
        .link-box { background: #e8f5e9; padding: 15px; border-radius: 8px; word-break: break-all; margin-top: 10px; border: 1px solid #2e7d32; font-size: 0.9rem; }
        .label { font-weight: bold; font-size: 0.9rem; color: #555; margin-top: 15px; display: block;}
    </style>
</head>
<body>
    <div class="card">
        <h2>Setup Aami Achi</h2>
        <p>Enter your details to generate a private check-in link for your parents.</p>
        
        <div id="form-area">
            <input type="text" id="caregiver-name" placeholder="Your Name (e.g., Rahul)">
            <input type="tel" id="whatsapp-number" placeholder="WhatsApp Number with Country Code (e.g., 919876543210)">
            <button onclick="createFamily()">Generate Links</button>
        </div>

        <div id="result">
            <h3>Success! 🎉</h3>
            
            <span class="label">1. Send this link to your parents:</span>
            <div class="link-box" id="parent-link"></div>
            
            <span class="label">2. Bookmark this dashboard link for yourself:</span>
            <div class="link-box" id="dashboard-link"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        async function createFamily() {
            const name = document.getElementById('caregiver-name').value.trim();
            const phone = document.getElementById('whatsapp-number').value.trim();

            if (!name || !phone) {
                alert("Please fill in both fields.");
                return;
            }

            const response = await fetch(`${SUPABASE_URL}/rest/v1/families`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({ caregiver_name: name, whatsapp_number: phone })
            });

            const data = await response.json();
            
            if (response.ok) {
                const familyId = data[0].id;
                const currentUrl = window.location.href.split('?')[0].replace('setup.html', '');
                
                document.getElementById('form-area').style.display = 'none';
                document.getElementById('result').style.display = 'block';
                
                document.getElementById('parent-link').textContent = `${currentUrl}index.html?family=${familyId}`;
                document.getElementById('dashboard-link').textContent = `${currentUrl}dashboard.html?family=${familyId}`;
            } else {
                alert("Error creating profile. Check console.");
                console.error(data);
            }
        }
    </script>
</body>
</html>
